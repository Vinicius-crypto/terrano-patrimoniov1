{% extends "base.html" %}

{% block title %}Erro interno{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
  <div class="max-w-2xl mx-auto text-center">
    <div class="text-9xl text-gray-300 font-bold mb-4">500</div>
    <div class="bg-white rounded-lg shadow-lg p-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-4">Algo deu errado</h1>
      <p class="text-gray-600 text-lg mb-6">
        Ocorreu um erro interno. A ocorrência foi registrada nos logs.
      </p>
      <a href="{{ url_for('home') }}"
         class="inline-block bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700">
        Voltar ao início
      </a>
    </div>
  </div>
</div>
{% endblock %}
